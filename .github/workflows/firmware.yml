# Build the DynamicFrame factory firmware and publish it to GitHub Pages.
#
# WHERE THIS RUNS
#   This repository's canonical home is a private Gitea instance. The GitHub
#   repo github.com/GoogleBot42/picture-frame is a *push mirror* of it, so this
#   workflow only ever executes on the GitHub side, against the mirrored `main`
#   branch. Gitea itself runs no CI for this. Pushing to Gitea propagates to the
#   mirror, which is what triggers a build. (Actions must be enabled on the
#   mirror — see site/README.md for the one-time setup.)
#
# WHAT IT PRODUCES
#   https://googlebot42.github.io/picture-frame/                       — installer page (site/)
#   https://googlebot42.github.io/picture-frame/firmware/<variant>/manifest.json
#   https://googlebot42.github.io/picture-frame/firmware/<variant>/<name>.factory.bin
#   https://googlebot42.github.io/picture-frame/firmware/<variant>/<name>.ota.bin
#
#   The single manifest.json per variant serves two different consumers:
#     * esp-web-tools in the browser  -> reads `builds[].parts[]` (factory bin)
#     * the on-device `update:` / `platform: http_request` component
#                                     -> reads `version` + `builds[].ota{path,md5}`
#   esphome/build-action's `complete-manifest: true` output already contains
#   both, which is why we publish it verbatim instead of hand-rolling JSON.
#   Manifest `path` values are bare filenames, resolved relative to the manifest
#   URL by both consumers, so renaming the build directory to
#   `firmware/<variant>/` below is safe.

name: Firmware

on:
  push:
    branches: [main]
    paths:
      - "esphome/**"
      - "site/**"
      - ".github/workflows/firmware.yml"
  workflow_dispatch:

# Least privilege by default; the deploy job widens this for itself only.
permissions:
  contents: read

# Pages allows one in-flight deployment. Queue rather than cancel so a push
# that lands mid-build still gets published.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  # VERSION STAMPING — CONTRACT WITH esphome/factory/*.yaml
  #
  # esphome/build-action has no "project version" input. The manifest's
  # top-level `version` comes from `esphome.project.version` in the config
  # (entrypoint.py: `config.project_version or esphome_version`).
  #
  # On the device, http_request_update.cpp compares the two strings *exactly*:
  #     manifest "version"  ==  ESPHOME_PROJECT_VERSION   -> "up to date"
  #     anything else                                     -> "update available"
  # There is no semver parsing and no ordering. So the published manifest
  # version and the version compiled into the binary must come from the same
  # source (they do — both derive from `esphome.project.version`), and that
  # value must change on every publish or devices will never update.
  #
  # Therefore each esphome/factory/<variant>.yaml must wire the version to a
  # substitution that this workflow overrides:
  #
  #     substitutions:
  #       firmware_version: dev          # local builds
  #     esphome:
  #       project:
  #         name: googlebot42.picture-frame
  #         version: ${firmware_version}
  #
  # `1.<run_number>` is monotonic, short (ESPHome caps project versions at 30
  # chars), and human-meaningful in the Home Assistant update entity. Note that
  # re-running an existing run reuses its run_number, so a re-run publishes the
  # same version string — push a new commit to force devices to update.
  FIRMWARE_VERSION: 1.${{ github.run_number }}
  # Shown in Home Assistant next to the update entity.
  RELEASE_URL: ${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}

jobs:
  build:
    name: Build ${{ matrix.variant }}
    runs-on: ubuntu-latest
    # Generous: the ESP-IDF variant pulls a full toolchain on a cold runner.
    timeout-minutes: 120
    strategy:
      # Build every variant even if one breaks, so a single bad config gives a
      # complete picture. The deploy job still requires all five to succeed.
      fail-fast: false
      matrix:
        include:
          - variant: color7-tinypico
            build-timeout: 45
          - variant: color7-tinys3
            build-timeout: 45
          - variant: grey16-tinypico
            build-timeout: 45
          - variant: grey16-tinys3
            build-timeout: 45
          # ESP32-S3 + esp-idf framework + 32MB flash: by far the heaviest build.
          - variant: spectra13-inkplate
            build-timeout: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Build firmware
        id: build
        uses: esphome/build-action@v8.0.0
        timeout-minutes: ${{ matrix.build-timeout }}
        with:
          # Factory configs are secret-free: no secrets.yaml is created here and
          # none is needed. They carry dashboard_import + the http_request
          # update component pointed at this Pages site.
          yaml-file: esphome/factory/${{ matrix.variant }}.yaml
          # `latest` keeps devices on current ESPHome without workflow churn.
          # Pin to an explicit version here (>= 2026.7.0, required by
          # build-action v8) if an upstream release ever breaks a build.
          version: latest
          # Emit a full esp-web-tools manifest, not just a `builds[]` fragment,
          # because each variant gets its own directory and its own manifest.
          complete-manifest: true
          release-summary: "DynamicFrame ${{ matrix.variant }} firmware ${{ env.FIRMWARE_VERSION }}"
          release-url: ${{ env.RELEASE_URL }}
          substitutions: |
            firmware_version=${{ env.FIRMWARE_VERSION }}

      - name: Verify manifest
        shell: bash
        env:
          BUILD_DIR: ${{ steps.build.outputs.name }}
        run: |
          set -euo pipefail
          manifest="${BUILD_DIR}/manifest.json"
          if [ ! -f "$manifest" ]; then
            echo "::error::${manifest} was not produced by esphome/build-action"
            exit 1
          fi
          echo "::group::${manifest}"
          jq . "$manifest"
          echo "::endgroup::"

          got="$(jq -r '.version' "$manifest")"
          if [ "$got" != "${FIRMWARE_VERSION}" ]; then
            echo "::error file=esphome/factory/${{ matrix.variant }}.yaml::Manifest version is '${got}' but this build stamped '${FIRMWARE_VERSION}'. esphome/factory/${{ matrix.variant }}.yaml must set 'esphome.project.version: \${firmware_version}' with a 'firmware_version' substitution, so the build-time override takes effect. Without it the published version never changes and devices will never see an update (http_request update compares version strings exactly)."
            exit 1
          fi

          # esp-web-tools needs builds[].parts[]; http_request update needs
          # builds[].ota.path + .md5 and a chipFamily matching ESPHOME_VARIANT.
          jq -e '
            (.name | type == "string") and
            (.builds | length == 1) and
            (.builds[0].chipFamily | type == "string") and
            (.builds[0].parts | length > 0) and
            (.builds[0].ota.path | type == "string") and
            (.builds[0].ota.md5 | type == "string")
          ' "$manifest" > /dev/null || {
            echo "::error::manifest.json is missing fields required by esp-web-tools and/or the http_request update platform"
            exit 1
          }

          echo "${{ matrix.variant }}: version ${got}, chipFamily $(jq -r '.builds[0].chipFamily' "$manifest")" >> "$GITHUB_STEP_SUMMARY"

      - name: Stage published files
        shell: bash
        env:
          BUILD_DIR: ${{ steps.build.outputs.name }}
        run: |
          set -euo pipefail
          # Only the manifest and the binaries it references go to Pages.
          mkdir -p publish debug
          cp "${BUILD_DIR}/manifest.json" publish/
          cp "${BUILD_DIR}"/*.bin publish/
          # The ELF (debug symbols, for decoding stack traces) is large and of
          # no use to installers — keep it as a workflow artifact instead.
          cp "${BUILD_DIR}"/*.elf debug/
          ls -l publish debug

      - name: Upload firmware for Pages
        uses: actions/upload-artifact@v7.0.1
        with:
          name: firmware-${{ matrix.variant }}
          path: publish/
          if-no-files-found: error
          retention-days: 1

      - name: Upload debug symbols
        uses: actions/upload-artifact@v7.0.1
        with:
          name: debug-${{ matrix.variant }}
          path: debug/
          if-no-files-found: error
          retention-days: 30

  deploy:
    name: Deploy to GitHub Pages
    # All five must succeed: publishing a partial set would leave some devices
    # polling a manifest that still advertises the previous version.
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Download firmware artifacts
        uses: actions/download-artifact@v8.0.1
        with:
          # Without merge-multiple each artifact lands in artifacts/<name>/,
          # i.e. artifacts/firmware-<variant>/, which we rename below.
          pattern: firmware-*
          path: artifacts

      - name: Assemble site
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          mkdir -p _site/firmware
          cp -R site/. _site/
          found=0
          for dir in artifacts/firmware-*; do
            variant="$(basename "$dir")"
            variant="${variant#firmware-}"
            mv "$dir" "_site/firmware/${variant}"
            found=$((found + 1))
          done
          if [ "$found" -ne 5 ]; then
            echo "::error::Expected 5 firmware artifacts, found ${found}"
            exit 1
          fi
          {
            echo "### Published ${FIRMWARE_VERSION}"
            echo
            echo '```'
            find _site -type f | sort
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5.0.0
