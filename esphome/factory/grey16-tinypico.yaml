# Factory (public) firmware for the 16-grayscale TinyPico frame.
#
# This is what CI builds and publishes; end users never edit it. It is the
# adoptable config plus the pieces that only make sense for a pre-built binary:
#   - dashboard_import so the ESPHome dashboard can adopt the device
#   - ota/update over http_request so the published manifest can update it
# CI builds this only on a `vX.Y.Z` release tag, passing
# `firmware_version=<the tag without its leading v>`; the manifest version and
# the device's project version must match exactly for the update entity to work.

substitutions:
  firmware_version: dev
esphome:
  project:
    name: googlebot42.stillframe
    version: ${firmware_version}
  # Public builds are flashed to many identical devices; keep hostnames unique
  # until the device is adopted (adoption bakes the resolved name into the
  # user's config).
  name_add_mac_suffix: true
  on_boot:
    # Only worth checking for firmware updates when the frame is deliberately
    # staying awake long enough to install one, i.e. while "Prevent Deep Sleep"
    # is on (which is also what holding the wake button through a reset turns
    # on — see common.yaml's on_boot).
    #
    # The gate is a `wait_until` with NO timeout rather than a plain `if`, so
    # that flipping the switch on from Home Assistant *after* boot also opens
    # the window. On a normal wake it simply never completes, and the whole
    # automation dies with the chip when maybe_sleep enters deep sleep.
    #
    # `update_interval: never` below is the other half of this gate: otherwise
    # the update platform schedules its own check ~10 s after every single boot
    # regardless of anything here (HttpRequestUpdate::setup does this whenever
    # the interval is not "never"), which is exactly what this avoids. Home
    # Assistant's own "check for update" command still works — it calls the
    # entity directly rather than going through the poll interval.
    - priority: -200.0
      then:
        - wait_until:
            condition:
              switch.is_on: prevent_deep_sleep
        - wait_until:
            condition: wifi.connected
            timeout: 60s
        # Serialize behind the boot image fetch: the update check runs in its
        # own task whose watchdog raise/restore is global — overlapping a
        # blocking fetch clobbers the fetch raised window (field-observed
        # boot loop). Wait for the fetch script to finish before checking.
        - wait_until:
            condition:
              not:
                script.is_running: fetch_and_display
        - if:
            condition: wifi.connected
            then:
              - logger.log:
                  format: "Checking for firmware updates..."
                  level: INFO
              - component.update: firmware_update

packages:
  device: !include ../grey16-tinypico.yaml

dashboard_import:
  package_import_url: github://GoogleBot42/stillframe/esphome/grey16-tinypico.yaml@main
  import_full_config: false

ota:
  - platform: http_request

update:
  - platform: http_request
    name: "Firmware"
    id: firmware_update
    source: https://googlebot42.github.io/stillframe/firmware/grey16-tinypico/manifest.json
    # Never poll on a schedule: a frame is asleep almost all of the time, so a
    # periodic check just means "hit GitHub Pages on every wake". The explicit
    # `component.update: firmware_update` in on_boot above is the only
    # automatic check, and it only fires during a deliberate OTA window.
    update_interval: never
