# Factory (public) firmware for the 13.3" Spectra 6 Inkplate frame.
#
# Everything a factory build adds on top of the adoptable config — including
# the adoptable config itself, which common.yaml includes as `../${variant}.yaml` —
# lives in common.yaml. See the comments there.

substitutions:
  variant: spectra13-inkplate

packages:
  factory: !include common.yaml
