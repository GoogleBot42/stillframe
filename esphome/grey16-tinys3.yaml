# 16-grayscale IT8951 (1872x1404) on TinyS3 (ESP32-S3)

substitutions:
  # GPIO25 does not exist on the ESP32-S3; use the boot button (GPIO0) as the
  # wake button, or change to another RTC-capable pin (GPIO0-21) with a button.
  #
  # CAVEAT (unverified on hardware): GPIO0 is the S3's BOOT strapping pin. It
  # is sampled at every reset, including the one that ends a deep sleep, so
  # holding it down across a timer wake-up may drop the chip into the ROM
  # download loader instead of running the firmware. If the "hold the wake
  # button through a reset to open an OTA window" trick misbehaves here, wire
  # the button to a non-strapping RTC pin and set wake_pin to that instead.
  wake_pin: GPIO0

esphome:
  name: stillframe-grey16-s3

esp32:
  board: um_tinys3
  framework:
    type: arduino

# TinyS3 has 8MB QSPI (quad) PSRAM
psram:
  mode: quad

packages:
  common: !include common.yaml

# TinyS3 has no USB-UART bridge — its USB-C port is the ESP32-S3's native USB.
# improv_serial does not support USB_CDC on the S3, so log (and provision) over
# the USB Serial/JTAG peripheral.
logger:
  hardware_uart: USB_SERIAL_JTAG

spi:
  clk_pin: GPIO36
  mosi_pin: GPIO35
  miso_pin: GPIO37

it8951_spi:
  id: epaper_display
  cs_pin: GPIO34
  reset_pin: GPIO38
  hrdy_pin: GPIO33
  flip_horizontal: true
