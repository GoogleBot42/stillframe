# 16-grayscale IT8951 (1872x1404) on TinyPico (ESP32)

substitutions:
  wake_pin: GPIO25

esphome:
  name: stillframe-grey16

esp32:
  board: tinypico
  framework:
    type: arduino

psram:

packages:
  common: !include common.yaml

# Matches the legacy firmware wiring: SPI.begin(SCK=18, MISO=23, MOSI=19)
spi:
  clk_pin: GPIO18
  mosi_pin: GPIO19
  miso_pin: GPIO23

it8951_spi:
  id: epaper_display
  cs_pin: GPIO14
  reset_pin: GPIO15
  hrdy_pin: GPIO27
  flip_horizontal: true
