# Shared config for all Stillframe devices.
#
# This package is secretless on purpose: every user flashes the exact same
# public build and all personal configuration lives in NVS at runtime.
#   - WiFi credentials: provisioned over USB with Improv Serial (ESP Web Tools)
#   - API encryption key: pushed by Home Assistant when the device is adopted
#   - Server URL / auth header: the "Server URL" / "Server Auth Header" text
#     entities (restored from flash across deep sleep cycles)
#   - Wake period: the "Sleep Duration" number entity (likewise restored)
#
# Each device yaml provides:
#   - esphome: name
#   - esp32: board/framework
#   - logger: hardware_uart, when the board's USB port is not plain UART0
#   - spi: + a display component with id `epaper_display` implementing:
#       get_image_request_body(), get_image_byte_count(),
#       begin_image(), write_image_data(), finish_image(), wake(), sleep()
#   - substitutions: wake_pin (RTC-capable GPIO with a button to GND)

substitutions:
  # Where the custom display components come from. Defaults to the published
  # repo so an adopted config builds anywhere; esphome/dev.yaml overrides this
  # with the local `components` directory for driver development.
  components_source: github://GoogleBot42/stillframe@main
  # Initial value of the "Server URL" text entity (first boot / after reset).
  default_server_url: http://homeassistant.local:8080
  # Wake period, in whole minutes. This is only the *initial* value of the
  # "Sleep Duration" number entity (first boot / after a reset); the entity is
  # what actually drives every deep sleep, so a user who flashed a factory
  # binary can change the refresh rate without rebuilding anything. Every wake
  # is a full panel refresh, so keep it generous: e-ink panels and batteries
  # both dislike being cycled every couple of minutes.
  default_sleep_minutes: "60"

esphome:
  # NOTE: `project:` is deliberately NOT set here. Only the factory builds
  # (esphome/factory/*.yaml) stamp a project name/version, because that version
  # is what the http_request update component compares against the published
  # manifest. Adopted configs are built by the user's dashboard and simply have
  # no project version.
  on_boot:
    - priority: -100.0
      then:
        # Snapshot "was this frame already provisioned when it booted?" before
        # anything can change it. WiFiComponent::start() loads the saved
        # credentials during its own setup (setup_priority::WIFI, i.e. long
        # before this priority -100 automation) and improv_serial can only
        # call set_sta() from its loop(), which has not run yet — so has_sta()
        # here is exactly "credentials were in NVS at power-on".
        #
        # maybe_sleep needs that distinction because has_sta() alone cannot
        # tell "the user is provisioning right now" (set_sta() makes it true
        # for the whole 30 s connection attempt) from "provisioned frame whose
        # AP is down" — and those two want opposite answers: wait for the
        # connection and fetch, versus go back to sleep.
        - globals.set:
            id: had_wifi_creds_at_boot
            value: !lambda return wifi::global_wifi_component->has_sta();
        # Holding the wake button through the reset is the no-Home-Assistant
        # escape hatch for opening an OTA window: it simply turns the "Prevent
        # Deep Sleep" switch on, so there is exactly ONE piece of state that
        # holds the frame awake, it is visible in Home Assistant, and turning
        # it off (see the switch's on_turn_off) puts the frame back to sleep.
        - if:
            condition:
              binary_sensor.is_on: wake_button
            then:
              - logger.log:
                  format: "Wake button held at boot — turning on Prevent Deep Sleep"
                  level: INFO
              - switch.turn_on: prevent_deep_sleep
        # Always fetch: a wake is a wake, and refreshing the picture is the
        # whole job. maybe_sleep at the end of the script decides whether to
        # sleep afterwards, so "staying awake" never means "stop updating".
        - script.execute: fetch_and_display

external_components:
  - source: ${components_source}

wifi:
  # No credentials are compiled in. The device is provisioned over USB with
  # Improv Serial (https://web.esphome.io or the project's web installer).
  # There is deliberately no fallback AP / captive portal: re-provisioning is
  # done over USB, which keeps the build free of any secret.
  #
  # reboot_timeout 0: an unprovisioned frame stays awake (see maybe_sleep) and
  # must not reboot out from under an in-progress Improv session. A provisioned
  # frame that cannot reach the AP goes back to sleep instead of rebooting.
  reboot_timeout: 0s

improv_serial:

# Pulls in enter_flashing_mode(), which reboots the chip into the ESP32 ROM's
# serial downloader. That is the *reflash* escape hatch, the counterpart to
# Improv above: it needs no BOOT button, no strapping pin and no DTR/RTS
# timing, which is what makes reflashing a board like the Inkplate 13 Spectra
# (no BOOT button, IO0 not broken out, a marginal auto-download circuit, and a
# browser that cannot drive DTR/RTS atomically anyway) reliable at all.
# Exposed as the "Enter Flashing Mode" button and as an 8 s hold of the wake
# button; see both below.
flashing_mode:

api:
  # reboot_timeout 0: the default is 15 minutes, which would reboot any frame
  # that is not currently connected to Home Assistant — i.e. every frame that
  # is provisioned but not yet adopted, and every frame deliberately held awake
  # for an OTA window. A reboot here costs a full panel refresh and truncates
  # the OTA window, and it would also cut an in-progress Improv session short.
  reboot_timeout: 0s
  # No encryption key is compiled in. With `encryption:` present but empty,
  # both plaintext and noise transports are built and Home Assistant pushes a
  # dynamically generated PSK when the device is adopted; it is then stored in
  # flash and plaintext is disabled.
  encryption:
  on_client_connected:
    - globals.set:
        id: api_connected_this_boot
        value: "true"
    - globals.set:
        id: has_been_adopted
        value: "true"

ota:
  # No password: the ESPHome dashboard must be able to reflash an adopted
  # device over the factory firmware.
  - platform: esphome

logger:
  level: INFO

# Raise the global task watchdog from ESPHome's 5 s default to 60 s, the schema
# maximum (esp32/__init__.py feeds this straight into
# CONFIG_ESP_TASK_WDT_TIMEOUT_S, with CONFIG_ESP_TASK_WDT_PANIC=y).
#
# This setting is now the *sole* mechanism protecting the blocking HTTP fetch:
# esp_http_client is synchronous, so fetch_and_display's post() owns the loop
# task for the whole request and cannot feed the watchdog from inside it, and
# the compile-time timeout set here is the only thing that decides whether that
# call panics. There is deliberately no per-request `watchdog_timeout:` on
# http_request any more — see the comment there before adding one back.
#
# The trade: a frame that genuinely wedges reboots after 60 s instead of 5,
# which is fine for a device whose panel refresh alone takes ~25 s.
#
# History, so the superseded reasoning is not re-derived from scratch:
# http_request's WatchdogManager raise/restore is GLOBAL and not refcounted,
# and the factory update check runs in its own FreeRTOS task — when that task
# exited it restored the watchdog to the compile-time value, clobbering the
# window a blocking fetch was still standing on (a boot loop, back when that
# compile-time value was the 5 s default). With no `watchdog_timeout:`
# configured anywhere, every WatchdogManager is constructed with 0 and returns
# immediately, so nothing raises, restores or clobbers anything. The factory
# yamls still serialize the update check behind the fetch regardless.
esp32:
  watchdog_timeout: 60s

http_request:
  id: http_client
  # The server smart-crops and dithers a full panel image *before* responding
  # (CIEDE2000 over ~2M pixels on the 13.3" panel) — the first byte of the
  # response can legitimately take 15-25 s. 30 s covers it; a LAN server that
  # has not answered in 30 s is not answering.
  timeout: 30s
  # LOAD-BEARING ABSENCE: do NOT add `watchdog_timeout:` here.
  #
  # The background is still true. esp_http_client is *synchronous*: the post()
  # in fetch_and_display below blocks ESPHome's main loop for the whole request
  # — DNS (which can stall for many seconds on an unresolvable name such as the
  # default homeassistant.local), TCP connect, TLS, transfer — with the ESP32
  # task watchdog armed and panic enabled. No amount of feeding helps: the loop
  # task is *inside* the blocking call and never gets to feed. The only thing
  # standing between an unreachable server and "Task watchdog got triggered ...
  # loopTask -> abort" is the timeout the watchdog is armed with.
  #
  # What changed is where that timeout comes from. `esp32: watchdog_timeout:
  # 60s` above pins CONFIG_ESP_TASK_WDT_TIMEOUT_S at the schema maximum for the
  # entire firmware, which already covers perform(), every read() and end().
  # Setting this option now could only LOWER that deadline, never raise it:
  # http_request wraps those calls in a watchdog::WatchdogManager which does not
  # raise, it SETS unconditionally (watchdog.cpp: save the compile-time value,
  # esp_task_wdt_reconfigure() to whatever is configured here, restore on
  # destruction). Constructed with 0 — i.e. option absent — it returns
  # immediately and the 60 s global stays in force throughout, which is exactly
  # what we want.
  #
  # This block used to say 45 s, from back when the global default was 5 s. Once
  # the 60 s global landed, that 45 s silently cut 15 s off the panic deadline of
  # the longest-blocking calls and bought a pair of *global*
  # esp_task_wdt_reconfigure() calls per 4 KB read (~470 pairs per 13.3" image)
  # for the privilege. Do not reintroduce it from that old reasoning.
  #
  # 60 s is therefore also the real ceiling for `timeout:` plus name resolution:
  # the transport timeout only bounds socket operations, not DNS/mDNS, so
  # perform() can outlast it. Keep the whole blocking call well under 60 s.

deep_sleep:
  id: deep_sleep_control
  # Compile-time fallback only. Every `deep_sleep.enter` in maybe_sleep passes
  # a templated duration read from the "Sleep Duration" number entity, so this
  # value is what a sleep entered by any other path would use.
  sleep_duration: ${default_sleep_minutes}min
  wakeup_pin:
    number: ${wake_pin}
    inverted: true
    mode: INPUT_PULLUP
    allow_other_uses: true
  wakeup_pin_mode: KEEP_AWAKE

globals:
  # Set the first time Home Assistant connects and kept across deep sleep, so
  # the frame stays awake until it has been adopted at least once.
  - id: has_been_adopted
    type: bool
    restore_value: true
    initial_value: "false"
  - id: api_connected_this_boot
    type: bool
    restore_value: false
    initial_value: "false"
  # Set by fetch_and_display when a fetch actually finishes and the panel has
  # been given a complete image. Deliberately NOT set for a failed attempt: the
  # flag answers "does the panel already show something from this boot?", and a
  # failure leaves the old (or, on a fresh frame, blank) picture up — which is
  # exactly the case the provisioning hand-off below still needs to cover.
  - id: image_shown_this_boot
    type: bool
    restore_value: false
    initial_value: "false"
  # Snapshot of has_sta() taken in on_boot, before improv_serial's loop can run
  # — see the comment there.
  - id: had_wifi_creds_at_boot
    type: bool
    restore_value: false
    initial_value: "false"
  # True exactly while await_provisioning is parked on its wait_until, i.e.
  # while there is a hand-off that a deep sleep would kill. maybe_sleep sets it
  # when it arms the script (and only when the script was not already running,
  # so a dropped `script.execute` cannot leave it lying) and await_provisioning
  # clears it the moment its wait completes. `script.is_running` cannot stand in
  # for this: ESPHome plays scripts inline, so it is also true for
  # await_provisioning -> fetch_and_display -> maybe_sleep, which would make the
  # frame hold itself awake for a script that is about to unwind.
  - id: provisioning_handoff_parked
    type: bool
    restore_value: false
    initial_value: "false"

text:
  - platform: template
    name: "Server URL"
    id: server_url
    icon: mdi:server-network
    entity_category: config
    optimistic: true
    restore_value: true
    initial_value: ${default_server_url}
    max_length: 128
    mode: text
  # Sent verbatim as the `Authorization` header on /fetchImage. The stock Go
  # server in server/ ignores it entirely — it is only useful when the server
  # sits behind an authenticating reverse proxy. Leave empty otherwise.
  - platform: template
    name: "Server Auth Header"
    id: server_auth_header
    icon: mdi:key
    entity_category: config
    optimistic: true
    restore_value: true
    initial_value: ""
    max_length: 128
    mode: text

number:
  # How long the frame sleeps between refreshes. Runtime-configurable on
  # purpose: the published factory binaries are compiled once for everyone, so
  # the wake period must not be baked in. Read by maybe_sleep as a templated
  # `deep_sleep.enter` duration, and persisted across deep sleep in NVS.
  - platform: template
    name: "Sleep Duration"
    id: sleep_minutes
    icon: mdi:timer-sand
    entity_category: config
    unit_of_measurement: min
    device_class: duration
    mode: box
    optimistic: true
    restore_value: true
    initial_value: ${default_sleep_minutes}
    min_value: 1
    max_value: 1440 # 24h
    step: 1
    # Nothing to poll: the value only changes when it is set.
    update_interval: never

switch:
  - platform: template
    name: "Prevent Deep Sleep"
    id: prevent_deep_sleep
    optimistic: true
    # Persist across deep sleep cycles so the switch can actually hold the
    # device awake on its next wake-up (an OTA window).
    restore_mode: RESTORE_DEFAULT_OFF
    on_turn_on:
      - deep_sleep.prevent: deep_sleep_control
    on_turn_off:
      # `deep_sleep.allow` alone only un-blocks a sleep that something else
      # asks for, and nothing else ever does: there is no `run_duration`, so
      # the only sleeps are the explicit `deep_sleep.enter` calls in
      # maybe_sleep. Without re-running it here, turning the switch off would
      # leave the frame awake until it was power-cycled.
      - deep_sleep.allow: deep_sleep_control
      # ...but only for a *real* turn-off. TemplateSwitch::setup() applies the
      # restored state by calling turn_off(), which fires this trigger on every
      # normal boot — before on_boot, before any image is fetched. Running
      # maybe_sleep there would put a provisioned, adopted frame straight back
      # to sleep and it would never display anything again.
      # App.is_setup_complete() is only true once every component (including
      # the on_boot automations) has been set up, so it cleanly separates the
      # restore from a command arriving later over the API.
      - if:
          condition:
            lambda: return App.is_setup_complete();
          then:
            - script.execute: maybe_sleep

binary_sensor:
  - platform: gpio
    pin:
      number: ${wake_pin}
      inverted: true
      mode: INPUT_PULLUP
      allow_other_uses: true
    name: "Wake Button"
    id: wake_button
    # Hold for 8 s to reboot into flashing mode — the no-Home-Assistant version
    # of the "Enter Flashing Mode" button below, and the only way back into a
    # frame that is unprovisioned, unadopted or otherwise unreachable. The hold
    # is timed by the flashing_mode_hold script; see it for how this coexists
    # with the button's two existing jobs.
    on_press:
      - script.execute: flashing_mode_hold
    on_release:
      - script.stop: flashing_mode_hold

button:
  - platform: template
    name: "Fetch Image Now"
    id: fetch_image_now
    on_press:
      - script.execute: fetch_and_display
  # Recovery path for boards without a BOOT button: reboot into the ROM serial
  # downloader (see the `flashing_mode:` block above). The frame stops being a
  # frame until it is reset — the ROM downloader does nothing but wait for
  # esptool — so getting out is the RESET button or a power cycle (both reset
  # the RTC domain the bit lives in; esptool also clears it after flashing, and
  # the component clears it on every boot).
  - platform: template
    name: "Enter Flashing Mode"
    id: enter_flashing_mode_button
    icon: mdi:usb-flash-drive
    entity_category: config
    on_press:
      - lambda: flashing_mode::enter_flashing_mode();

script:
  - id: fetch_and_display
    then:
      - wait_until:
          condition: wifi.connected
          timeout: 60s
      - if:
          condition: wifi.connected
          then:
            - lambda: id(epaper_display).wake();
            - logger.log:
                format: "Fetching image from server..."
                level: INFO
            # Stream the HTTP response straight to the display in small
            # chunks instead of buffering the whole image in RAM.
            - lambda: |-
                static const char *FTAG = "frame";
                // Server URL comes from the runtime-configurable text entity.
                std::string base = id(server_url).state;
                while (!base.empty() && base.back() == '/')
                  base.pop_back();
                if (base.empty()) {
                  // Deliberately NOT retried: an unconfigured URL is a config
                  // error a human has to fix, and retrying it would only burn
                  // battery and delay the sleep.
                  ESP_LOGE(FTAG, "Server URL is not configured");
                  return;
                }
                std::string url = base + "/fetchImage";
                std::vector<http_request::Header> headers;
                headers.push_back({"Content-Type", "application/json"});
                std::string auth = id(server_auth_header).state;
                if (!auth.empty())
                  headers.push_back({"Authorization", auth});
                std::string body = id(epaper_display).get_image_request_body();
                size_t expected = id(epaper_display).get_image_byte_count();

                // Bounded retry. Without it, a single blip — the server still
                // booting, a dropped DNS answer, a connection refused while
                // systemd restarts the unit, a truncated stream — costs a whole
                // "Sleep Duration" (default 60 min) of stale picture, and the
                // frame's failure mode is silent: it just shows yesterday's
                // photo. Three attempts is the trade: worst case the frame
                // stays awake ~100 s (3 x the 30 s http `timeout:` plus 2 x 5 s
                // between attempts, and a mid-stream stall can add up to the
                // read loop's own 30 s no-data window) before sleeping, versus
                // an hour of not noticing.
                //
                // Only *transient* failures are retried: no container (DNS,
                // refused, unreachable), a non-200 status, or an incomplete
                // stream. wake()/sleep() stay outside the loop — one panel
                // wake per script run, not per attempt — and a failed attempt
                // that already opened a transfer is closed out with
                // finish_image(false) before the next begin_image(), which
                // resets bytes_written_/transfer_failed_ and reopens the
                // session (see eink_frame.cpp), so a retried transfer starts
                // clean.
                const int max_attempts = 3;
                const uint32_t retry_delay_ms = 5000;
                for (int attempt = 1; attempt <= max_attempts; attempt++) {
                  if (attempt > 1)
                    ESP_LOGW(FTAG, "Retrying fetch (attempt %d/%d)...", attempt, max_attempts);
                  bool ok = false;
                  auto container = id(http_client)->post(url, body, headers);
                  if (container == nullptr) {
                    ESP_LOGE(FTAG, "HTTP request failed");
                  } else if (container->status_code != 200) {
                    ESP_LOGE(FTAG, "HTTP error %d", container->status_code);
                    container->end();
                  } else {
                    if (container->content_length > 0 && container->content_length != expected) {
                      ESP_LOGW(FTAG, "Server sent %u bytes but display expects %u",
                               (unsigned) container->content_length, (unsigned) expected);
                    }
                    ESP_LOGI(FTAG, "Streaming %u bytes to display...", (unsigned) expected);
                    id(epaper_display).begin_image();
                    std::vector<uint8_t> buf(4096);
                    uint32_t last_data = millis();
                    bool complete = false;
                    while (true) {
                      int n = container->read(buf.data(), buf.size());
                      // Writing a chunk to the panel can block for a while (SPI
                      // plus a controller busy-wait), so keep the watchdog fed.
                      // eink_frame::feed_watchdog() rather than App.feed_wdt():
                      // see eink_wait.h — a bare feed logs "task not found" from
                      // any task ESPHome has not subscribed to the watchdog.
                      eink_frame::feed_watchdog();
                      yield();
                      auto res = http_request::http_read_loop_result(
                          n, last_data, 30000, container->is_read_complete());
                      if (res == http_request::HttpReadLoopResult::DATA) {
                        id(epaper_display).write_image_data(buf.data(), n);
                        continue;
                      }
                      if (res == http_request::HttpReadLoopResult::RETRY)
                        continue;
                      complete = (res == http_request::HttpReadLoopResult::COMPLETE);
                      break;
                    }
                    size_t received = container->get_bytes_read();
                    container->end();
                    ok = complete && received >= expected;
                    if (!ok) {
                      ESP_LOGE(FTAG, "Download incomplete: %u/%u bytes",
                               (unsigned) received, (unsigned) expected);
                    }
                    // Always closes the transfer the begin_image() above opened,
                    // success or not, so the next attempt (and the driver's
                    // frame buffer) is not left half-open.
                    id(epaper_display).finish_image(ok);
                  }
                  if (ok) {
                    // The panel now shows a picture from this boot, which is
                    // what stops maybe_sleep from arming the provisioning
                    // hand-off (and re-fetching) behind us.
                    id(image_shown_this_boot) = true;
                    break;
                  }
                  if (attempt == max_attempts) {
                    ESP_LOGE(FTAG, "Fetch failed %d times — leaving the current picture up", max_attempts);
                    break;
                  }
                  // We are inside a lambda, i.e. on the blocked main loop: a
                  // `- delay:` action is not available here. Spin on millis()
                  // and keep the watchdog fed the same way (and for the same
                  // reason) as the read loop above — never a bare
                  // App.feed_wdt().
                  uint32_t waited_from = millis();
                  while (millis() - waited_from < retry_delay_ms) {
                    eink_frame::feed_watchdog();
                    yield();
                  }
                }
            - lambda: id(epaper_display).sleep();
          else:
            # No sleep decision is made here — maybe_sleep below owns it, and
            # on an unprovisioned frame (or one whose Improv connection is
            # still in flight) it deliberately stays awake instead.
            - logger.log:
                format: "WiFi did not connect — skipping the fetch"
                level: WARN
      - script.execute: maybe_sleep

  # Deep sleep guardrails. The frame must stay awake while it still needs a
  # human: unprovisioned (no WiFi credentials in NVS) or mid-provisioning,
  # never adopted by Home Assistant, or deliberately pinned awake with the
  # "Prevent Deep Sleep" switch. Once it has been adopted at least once it
  # resumes the normal wake -> fetch -> sleep cycle even if HA is temporarily
  # unreachable.
  #
  # Arming the provisioning hand-off happens FIRST and outside the sleep
  # decision, because it is orthogonal to it: a frame held awake by the switch
  # needs the hand-off just as much as one that would otherwise sleep (an
  # unprovisioned frame booted into an OTA window used to take the switch
  # branch and never arm anything, so provisioning it produced no image that
  # boot either).
  #
  # There is deliberately no wake-button check here: `wakeup_pin_mode:
  # KEEP_AWAKE` already makes deep_sleep.enter defer while the button is still
  # held and latch the sleep for the moment it is released. A condition here
  # would instead mean "held at this instant -> never sleep again this boot".
  # Holding the button through a reset opens an OTA window by turning the
  # switch on (see on_boot), which is what the first branch below honours.
  - id: maybe_sleep
    then:
      # Is this boot waiting on Improv provisioning for its picture? Two ways in:
      #
      #   - No credentials right now (has_sta() false). Either never
      #     provisioned, or an Improv attempt just failed — improv_serial's 30 s
      #     wifi-connect-timeout ends in clear_sta(). Arm regardless of whether
      #     a picture was already fetched this boot: the frame is not going to
      #     sleep in this state anyway (see the stay-awake check below), so the
      #     hand-off is the only thing that will act on the user's next attempt.
      #
      #   - Credentials appeared *during* this boot and there is still no
      #     picture. This is the case a plain has_sta() test got wrong:
      #     improv_serial calls set_sta() before start_connecting(), so has_sta()
      #     is already true for the whole 30 s attempt. Credentials submitted at
      #     ~t=45 s whose connection completes after fetch_and_display's 60 s
      #     WiFi wait used to look exactly like a normal provisioned frame — the
      #     hand-off was never armed and the frame adopted and slept with a blank
      #     panel until the next wake.
      #
      #     Both extra clauses are load-bearing here. `had_wifi_creds_at_boot`
      #     keeps a *provisioned* frame whose AP is merely down (has_sta true,
      #     never connects, fetch skipped) out of this branch, so it sleeps and
      #     retries on the next wake instead of parking awake forever on
      #     battery. `image_shown_this_boot` stops the fetch that the hand-off
      #     itself triggers from re-arming the hand-off.
      #
      # Note both paths return true only when await_provisioning's own wait
      # condition (connected AND has_sta) is false, so the script is guaranteed
      # to park rather than run through on this stack — which is what makes
      # provisioning_handoff_parked below truthful. Already connected with
      # credentials and no picture just means the fetch failed; that is a server
      # problem, not a provisioning one, and retry-on-next-wake is the answer.
      #
      # This runs first and outside the sleep decision on purpose: a frame held
      # awake by "Prevent Deep Sleep" (an OTA window opened with the wake button)
      # needs the hand-off just as much as one that would otherwise sleep.
      - if:
          condition:
            and:
              - lambda: |-
                  if (!wifi::global_wifi_component->has_sta())
                    return true;
                  return !id(image_shown_this_boot) &&
                         !id(had_wifi_creds_at_boot) &&
                         !wifi::global_wifi_component->is_connected();
              # Only arm what can actually be armed. A single-mode script drops
              # the execute while it is running — including while it is running
              # *this* action list, via await_provisioning -> fetch_and_display
              # -> maybe_sleep — and claiming a parked hand-off that was never
              # created would hold the frame awake forever with nothing left to
              # fire. If it is genuinely parked, this is a no-op anyway.
              - not:
                  script.is_running: await_provisioning
          then:
            - logger.log:
                format: "No picture yet and no WiFi credentials — waiting for Improv provisioning"
                level: INFO
            # Staying awake is only half the job: nothing else would ever
            # run again once the user actually provisions. Improv's
            # save_wifi_sta() connects without rebooting, and the only
            # other entries into fetch_and_display are on_boot and the
            # "Fetch Image Now" button — so without this hand-off the
            # frame sits connected, adoptable, blank and awake until a
            # human power-cycles it. await_provisioning restarts the
            # normal fetch -> maybe_sleep flow when WiFi comes up.
            - globals.set:
                id: provisioning_handoff_parked
                value: "true"
            - script.execute: await_provisioning
      - if:
          condition:
            switch.is_on: prevent_deep_sleep
          then:
            # Load-bearing: deep_sleep.enter ignores deep_sleep.prevent, so the
            # switch can only work by being checked here.
            - logger.log:
                format: "Prevent Deep Sleep is ON — staying awake"
                level: INFO
          else:
            - if:
                condition:
                  or:
                    # No credentials at all: never sleep, a human is needed.
                    - lambda: return !wifi::global_wifi_component->has_sta();
                    # ...and never sleep out from under a parked hand-off,
                    # which deep_sleep.enter would kill along with the chip.
                    # Strictly "parked", not "armed at some point this boot":
                    # once it has fired, a frame that still has no picture is
                    # in the ordinary failed-fetch case and should sleep and
                    # retry on the next wake, not sit awake forever.
                    - lambda: return id(provisioning_handoff_parked);
                then:
                  - logger.log:
                      format: "Waiting for WiFi provisioning — staying awake"
                      level: INFO
                else:
                  - if:
                      condition:
                        lambda: return !id(has_been_adopted);
                      then:
                        - logger.log:
                            format: "Never adopted by Home Assistant — staying awake"
                            level: INFO
                        # Wait for Home Assistant to discover and adopt the
                        # device on this first provisioned boot. Untimed on
                        # purpose (same pattern as the factory on_boot update
                        # gate): the frame is staying awake either way, so a
                        # timeout would only mean "adoption at minute 6 leaves
                        # the frame stranded awake forever", since
                        # api.on_client_connected just sets globals and nothing
                        # re-runs this script. With no timeout the wait simply
                        # completes whenever adoption happens — and if it never
                        # does, it dies with the chip at the next reset.
                        - wait_until:
                            condition:
                              lambda: return id(api_connected_this_boot);
                        # Re-check the switch, and only the switch: adoption may
                        # have taken minutes and Home Assistant may have turned
                        # it on meanwhile. (has_been_adopted is not re-checked
                        # because it cannot be false here — the wait above only
                        # completes once api_connected_this_boot is true, and
                        # api.on_client_connected sets both globals in the same
                        # synchronous action list.)
                        - if:
                            condition:
                              switch.is_off: prevent_deep_sleep
                            then:
                              - logger.log:
                                  format: "Adopted — entering deep sleep..."
                                  level: INFO
                              - deep_sleep.enter:
                                  id: deep_sleep_control
                                  sleep_duration: !lambda |-
                                    // NaN-safe (also catches a not-yet-restored state).
                                    float m = id(sleep_minutes).state;
                                    if (!(m >= 1.0f)) m = ${default_sleep_minutes};
                                    return (uint32_t) (m * 60000.0f);
                      else:
                        - logger.log:
                            format: "Entering deep sleep..."
                            level: INFO
                        - deep_sleep.enter:
                            id: deep_sleep_control
                            sleep_duration: !lambda |-
                              // NaN-safe (also catches a not-yet-restored state).
                              float m = id(sleep_minutes).state;
                              if (!(m >= 1.0f)) m = ${default_sleep_minutes};
                              return (uint32_t) (m * 60000.0f);

  # The second half of maybe_sleep's provisioning check: pick the normal
  # wake -> fetch -> sleep cycle back up the moment provisioning succeeds,
  # instead of leaving a freshly provisioned frame awake and blank.
  #
  # Why this is its own script and not a wait_until appended to that branch:
  # ESPHome actions run inline. `script.execute` plays the target script on the
  # caller's stack, and every enclosing action keeps `num_running_ > 0` — hence
  # keeps its script `is_running()` — until its branch reaches the end, across
  # an asynchronous wait_until too. Fetching from inside maybe_sleep would
  # therefore hit fetch_and_display's trailing `script.execute: maybe_sleep`
  # while that very (single-mode) maybe_sleep was still on the stack, and the
  # sleep check would be dropped with "Script 'maybe_sleep' is already
  # running!". Parking the wait in a separate script avoids that: the wait_until
  # below suspends immediately (its condition is false by construction — see
  # there), maybe_sleep unwinds and finishes, and the fetch that resumes minutes
  # later runs on a clean stack.
  #
  # Single mode is the loop guard: while parked, further executes are dropped
  # (and maybe_sleep does not even try — it checks is_running before arming, so
  # it never records a park it did not create). Once it has fired, only another
  # maybe_sleep that finds the frame waiting on provisioning again can re-arm
  # it, and the fetch it just ran clears the "no picture this boot" clause on
  # success — so a WiFi drop later cannot spin this into a fetch loop.
  - id: await_provisioning
    then:
      # Untimed: the frame has nothing else to do until a human provisions it,
      # and any timeout here would just recreate the stranding this fixes.
      #
      # BOTH halves are load-bearing, and together they are what makes this
      # condition false at entry — which is what lets maybe_sleep unwind before
      # anything else happens (see above):
      #   - connected, because improv_serial only calls save_wifi_sta() once the
      #     AP has accepted the credentials. has_sta() alone is true throughout
      #     every attempt (set_sta() runs first) including the failing ones, so
      #     it would fire this script on a typo'd password.
      #   - has_sta, because a failed attempt ends in clear_sta(), which only
      #     empties the credential list — it does not disconnect, and the whole
      #     reconnect state machine in WiFiComponent::loop() sits behind
      #     `if (this->has_sta())`. So a connection that comes up *after*
      #     improv's 30 s timeout leaves the frame connected with nothing in
      #     NVS. Firing there would fetch once and then strand the frame again:
      #     fetch_and_display's tail maybe_sleep would want to re-arm this
      #     script and could not — it is still on the stack, exactly the trap
      #     described above — so the frame would end the boot with no hand-off
      #     parked and no way back. Waiting for both keeps us parked for the
      #     user's retry instead.
      - wait_until:
          condition:
            lambda: |-
              return wifi::global_wifi_component->is_connected() &&
                     wifi::global_wifi_component->has_sta();
      # No longer parked: from here on this script is running on its own two
      # feet and a deep sleep would not be cutting a wait short. Cleared before
      # the delay below so the maybe_sleep at the end of the fetch sees the
      # truth (see that flag's definition for why is_running() cannot be used).
      - globals.set:
          id: provisioning_handoff_parked
          value: "false"
      # Let improv_serial's loop see the connection first. It is what saves the
      # credentials to NVS, cancels its 30 s "wifi-connect-timeout" (whose
      # handler calls clear_sta()) and answers the web installer, and it only
      # does any of that from its own loop(). fetch_and_display below blocks the
      # main loop for the whole request plus panel refresh, and component loop
      # order is not stable at runtime (Application::enable_loop_() reshuffles
      # looping_components_, and this wait_until enables/disables its loop
      # constantly), so without a gap the fetch can preempt that save and let
      # the timeout wipe the new credentials instead.
      - delay: 5s
      - script.execute: fetch_and_display

  # Wake-button hold -> flashing mode. Started by the button's on_press and
  # killed by its on_release, so only an uninterrupted 8 s hold gets to the end.
  #
  # The hold is only counted while the firmware is RUNNING. In deep sleep the
  # button is a wake source and the press that wakes the frame is consumed by
  # the wake itself, so the user flow is "press WAKE, then keep holding": the
  # GPIO binary sensor publishes its initial state during setup, which fires
  # on_press for a button that is already down when the app starts, and the 8 s
  # are timed from there.
  #
  # This does not disturb either existing use of the button, because both are
  # over in about a second:
  #   - a short press wakes the frame (deep_sleep wakeup_pin, KEEP_AWAKE);
  #   - holding it through a reset opens an OTA window by turning on "Prevent
  #     Deep Sleep" (see on_boot) and only needs to be held until that logs.
  # Nothing else can reach 8 s by accident, and the warning at 3 s says out loud
  # what is about to happen while there is still time to let go.
  #
  # Timing is best-effort: a blocking main loop (an image download, a panel
  # refresh) postpones the delays rather than cancelling them, so on a busy
  # boot the reboot can land after the refresh instead of exactly at 8 s. The
  # frame cannot fall asleep out from under the hold in the meantime: while the
  # wake pin reads active, `wakeup_pin_mode: KEEP_AWAKE` makes every
  # deep_sleep.enter defer (and holding at boot has already turned on "Prevent
  # Deep Sleep" anyway — which stays on afterwards, keeping the freshly
  # reflashed frame awake until it is switched off from Home Assistant).
  - id: flashing_mode_hold
    mode: restart
    then:
      - delay: 3s
      - logger.log:
          format: "Wake button held — keep holding for flashing mode"
          level: WARN
      - delay: 5s
      - lambda: flashing_mode::enter_flashing_mode();
