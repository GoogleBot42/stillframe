# Shared config for all Stillframe devices.
#
# This package is secretless on purpose: every user flashes the exact same
# public build and all personal configuration lives in NVS at runtime.
#   - WiFi credentials: provisioned over USB with Improv Serial (ESP Web Tools)
#   - API encryption key: pushed by Home Assistant when the device is adopted
#   - Server URL / auth header: the "Server URL" / "Server Auth Header" text
#     entities (restored from flash across deep sleep cycles)
#   - Wake period: the "Sleep Duration" number entity (likewise restored)
#
# Each device yaml provides:
#   - esphome: name
#   - esp32: board/framework
#   - logger: hardware_uart, when the board's USB port is not plain UART0
#   - spi: + a display component with id `epaper_display` implementing:
#       get_image_request_body(), get_image_byte_count(),
#       begin_image(), write_image_data(), finish_image(), wake(), sleep()
#   - substitutions: wake_pin (RTC-capable GPIO with a button to GND)

substitutions:
  # Where the custom display components come from. Defaults to the published
  # repo so an adopted config builds anywhere; esphome/dev.yaml overrides this
  # with the local `components` directory for driver development.
  components_source: github://GoogleBot42/stillframe@main
  # Initial value of the "Server URL" text entity (first boot / after reset).
  default_server_url: http://homeassistant.local:8080
  # Wake period, in whole minutes. This is only the *initial* value of the
  # "Sleep Duration" number entity (first boot / after a reset); the entity is
  # what actually drives every deep sleep, so a user who flashed a factory
  # binary can change the refresh rate without rebuilding anything. Every wake
  # is a full panel refresh, so keep it generous: e-ink panels and batteries
  # both dislike being cycled every couple of minutes.
  default_sleep_minutes: "60"

esphome:
  # NOTE: `project:` is deliberately NOT set here. Only the factory builds
  # (esphome/factory/*.yaml) stamp a project name/version, because that version
  # is what the http_request update component compares against the published
  # manifest. Adopted configs are built by the user's dashboard and simply have
  # no project version.
  on_boot:
    - priority: -100.0
      then:
        # Holding the wake button through the reset is the no-Home-Assistant
        # escape hatch for opening an OTA window: it simply turns the "Prevent
        # Deep Sleep" switch on, so there is exactly ONE piece of state that
        # holds the frame awake, it is visible in Home Assistant, and turning
        # it off (see the switch's on_turn_off) puts the frame back to sleep.
        - if:
            condition:
              binary_sensor.is_on: wake_button
            then:
              - logger.log:
                  format: "Wake button held at boot — turning on Prevent Deep Sleep"
                  level: INFO
              - switch.turn_on: prevent_deep_sleep
        # Always fetch: a wake is a wake, and refreshing the picture is the
        # whole job. maybe_sleep at the end of the script decides whether to
        # sleep afterwards, so "staying awake" never means "stop updating".
        - script.execute: fetch_and_display

external_components:
  - source: ${components_source}

wifi:
  # No credentials are compiled in. The device is provisioned over USB with
  # Improv Serial (https://web.esphome.io or the project's web installer).
  # There is deliberately no fallback AP / captive portal: re-provisioning is
  # done over USB, which keeps the build free of any secret.
  #
  # reboot_timeout 0: an unprovisioned frame stays awake (see maybe_sleep) and
  # must not reboot out from under an in-progress Improv session. A provisioned
  # frame that cannot reach the AP goes back to sleep instead of rebooting.
  reboot_timeout: 0s

improv_serial:

# Pulls in enter_flashing_mode(), which reboots the chip into the ESP32 ROM's
# serial downloader. That is the *reflash* escape hatch, the counterpart to
# Improv above: it needs no BOOT button, no strapping pin and no DTR/RTS
# timing, which is what makes reflashing a board like the Inkplate 13 Spectra
# (no BOOT button, IO0 not broken out, a marginal auto-download circuit, and a
# browser that cannot drive DTR/RTS atomically anyway) reliable at all.
# Exposed as the "Enter Flashing Mode" button and as an 8 s hold of the wake
# button; see both below.
flashing_mode:

api:
  # reboot_timeout 0: the default is 15 minutes, which would reboot any frame
  # that is not currently connected to Home Assistant — i.e. every frame that
  # is provisioned but not yet adopted, and every frame deliberately held awake
  # for an OTA window. A reboot here costs a full panel refresh and truncates
  # the OTA window, and it would also cut an in-progress Improv session short.
  reboot_timeout: 0s
  # No encryption key is compiled in. With `encryption:` present but empty,
  # both plaintext and noise transports are built and Home Assistant pushes a
  # dynamically generated PSK when the device is adopted; it is then stored in
  # flash and plaintext is disabled.
  encryption:
  on_client_connected:
    - globals.set:
        id: api_connected_this_boot
        value: "true"
    - globals.set:
        id: has_been_adopted
        value: "true"

ota:
  # No password: the ESPHome dashboard must be able to reflash an adopted
  # device over the factory firmware.
  - platform: esphome

logger:
  level: INFO

http_request:
  id: http_client
  # A frame server on the LAN that has not answered in 15 s is not answering.
  # Waiting longer only delays the "go back to sleep" path (and, before the
  # watchdog_timeout below existed, made a reboot loop more likely).
  timeout: 15s
  # LOAD-BEARING. esp_http_client is *synchronous*: the post() in
  # fetch_and_display below blocks ESPHome's main loop for the whole request —
  # DNS (which can stall for many seconds on an unresolvable name such as the
  # default homeassistant.local), TCP connect, TLS, transfer — while the ESP32
  # task watchdog is armed at 5 s with panic enabled (esp32/__init__.py sets
  # CONFIG_ESP_TASK_WDT_TIMEOUT_S from `esp32: watchdog_timeout:`, default 5s,
  # and CONFIG_ESP_TASK_WDT_PANIC=y). No amount of feeding helps: the loop task
  # is *inside* the blocking call and never gets to feed.
  #
  # This option is the sanctioned fix: http_request wraps perform(), read() and
  # end() in a watchdog::WatchdogManager, which raises the task watchdog to this
  # value for the duration and restores it afterwards. Without it the manager is
  # constructed with 0 and does nothing at all (watchdog.cpp: `if (timeout_ms ==
  # 0) return;`), which is why an unreachable server used to reboot-loop the
  # frame: fetch -> 5 s -> "Task watchdog got triggered ... loopTask" -> abort.
  #
  # Comfortably above `timeout:` on purpose: the transport timeout only bounds
  # socket operations, not name resolution, so perform() can outlast it.
  watchdog_timeout: 45s

deep_sleep:
  id: deep_sleep_control
  # Compile-time fallback only. Every `deep_sleep.enter` in maybe_sleep passes
  # a templated duration read from the "Sleep Duration" number entity, so this
  # value is what a sleep entered by any other path would use.
  sleep_duration: ${default_sleep_minutes}min
  wakeup_pin:
    number: ${wake_pin}
    inverted: true
    mode: INPUT_PULLUP
    allow_other_uses: true
  wakeup_pin_mode: KEEP_AWAKE

globals:
  # Set the first time Home Assistant connects and kept across deep sleep, so
  # the frame stays awake until it has been adopted at least once.
  - id: has_been_adopted
    type: bool
    restore_value: true
    initial_value: "false"
  - id: api_connected_this_boot
    type: bool
    restore_value: false
    initial_value: "false"

text:
  - platform: template
    name: "Server URL"
    id: server_url
    icon: mdi:server-network
    entity_category: config
    optimistic: true
    restore_value: true
    initial_value: ${default_server_url}
    max_length: 128
    mode: text
  # Sent verbatim as the `Authorization` header on /fetchImage. The stock Go
  # server in server/ ignores it entirely — it is only useful when the server
  # sits behind an authenticating reverse proxy. Leave empty otherwise.
  - platform: template
    name: "Server Auth Header"
    id: server_auth_header
    icon: mdi:key
    entity_category: config
    optimistic: true
    restore_value: true
    initial_value: ""
    max_length: 128
    mode: text

number:
  # How long the frame sleeps between refreshes. Runtime-configurable on
  # purpose: the published factory binaries are compiled once for everyone, so
  # the wake period must not be baked in. Read by maybe_sleep as a templated
  # `deep_sleep.enter` duration, and persisted across deep sleep in NVS.
  - platform: template
    name: "Sleep Duration"
    id: sleep_minutes
    icon: mdi:timer-sand
    entity_category: config
    unit_of_measurement: min
    device_class: duration
    mode: box
    optimistic: true
    restore_value: true
    initial_value: ${default_sleep_minutes}
    min_value: 1
    max_value: 1440 # 24h
    step: 1
    # Nothing to poll: the value only changes when it is set.
    update_interval: never

switch:
  - platform: template
    name: "Prevent Deep Sleep"
    id: prevent_deep_sleep
    optimistic: true
    # Persist across deep sleep cycles so the switch can actually hold the
    # device awake on its next wake-up (an OTA window).
    restore_mode: RESTORE_DEFAULT_OFF
    on_turn_on:
      - deep_sleep.prevent: deep_sleep_control
    on_turn_off:
      # `deep_sleep.allow` alone only un-blocks a sleep that something else
      # asks for, and nothing else ever does: there is no `run_duration`, so
      # the only sleeps are the explicit `deep_sleep.enter` calls in
      # maybe_sleep. Without re-running it here, turning the switch off would
      # leave the frame awake until it was power-cycled.
      - deep_sleep.allow: deep_sleep_control
      # ...but only for a *real* turn-off. TemplateSwitch::setup() applies the
      # restored state by calling turn_off(), which fires this trigger on every
      # normal boot — before on_boot, before any image is fetched. Running
      # maybe_sleep there would put a provisioned, adopted frame straight back
      # to sleep and it would never display anything again.
      # App.is_setup_complete() is only true once every component (including
      # the on_boot automations) has been set up, so it cleanly separates the
      # restore from a command arriving later over the API.
      - if:
          condition:
            lambda: return App.is_setup_complete();
          then:
            - script.execute: maybe_sleep

binary_sensor:
  - platform: gpio
    pin:
      number: ${wake_pin}
      inverted: true
      mode: INPUT_PULLUP
      allow_other_uses: true
    name: "Wake Button"
    id: wake_button
    # Hold for 8 s to reboot into flashing mode — the no-Home-Assistant version
    # of the "Enter Flashing Mode" button below, and the only way back into a
    # frame that is unprovisioned, unadopted or otherwise unreachable. The hold
    # is timed by the flashing_mode_hold script; see it for how this coexists
    # with the button's two existing jobs.
    on_press:
      - script.execute: flashing_mode_hold
    on_release:
      - script.stop: flashing_mode_hold

button:
  - platform: template
    name: "Fetch Image Now"
    id: fetch_image_now
    on_press:
      - script.execute: fetch_and_display
  # Recovery path for boards without a BOOT button: reboot into the ROM serial
  # downloader (see the `flashing_mode:` block above). The frame stops being a
  # frame until it is reset — the ROM downloader does nothing but wait for
  # esptool — so getting out is the RESET button or a power cycle (both reset
  # the RTC domain the bit lives in; esptool also clears it after flashing, and
  # the component clears it on every boot).
  - platform: template
    name: "Enter Flashing Mode"
    id: enter_flashing_mode_button
    icon: mdi:usb-flash-drive
    entity_category: config
    on_press:
      - lambda: flashing_mode::enter_flashing_mode();

script:
  - id: fetch_and_display
    then:
      - wait_until:
          condition: wifi.connected
          timeout: 60s
      - if:
          condition: wifi.connected
          then:
            - lambda: id(epaper_display).wake();
            - logger.log:
                format: "Fetching image from server..."
                level: INFO
            # Stream the HTTP response straight to the display in small
            # chunks instead of buffering the whole image in RAM.
            - lambda: |-
                static const char *FTAG = "frame";
                // Server URL comes from the runtime-configurable text entity.
                std::string base = id(server_url).state;
                while (!base.empty() && base.back() == '/')
                  base.pop_back();
                if (base.empty()) {
                  ESP_LOGE(FTAG, "Server URL is not configured");
                  return;
                }
                std::string url = base + "/fetchImage";
                std::vector<http_request::Header> headers;
                headers.push_back({"Content-Type", "application/json"});
                std::string auth = id(server_auth_header).state;
                if (!auth.empty())
                  headers.push_back({"Authorization", auth});
                std::string body = id(epaper_display).get_image_request_body();
                auto container = id(http_client)->post(url, body, headers);
                if (container == nullptr) {
                  ESP_LOGE(FTAG, "HTTP request failed");
                  return;
                }
                if (container->status_code != 200) {
                  ESP_LOGE(FTAG, "HTTP error %d", container->status_code);
                  container->end();
                  return;
                }
                size_t expected = id(epaper_display).get_image_byte_count();
                if (container->content_length > 0 && container->content_length != expected) {
                  ESP_LOGW(FTAG, "Server sent %u bytes but display expects %u",
                           (unsigned) container->content_length, (unsigned) expected);
                }
                ESP_LOGI(FTAG, "Streaming %u bytes to display...", (unsigned) expected);
                id(epaper_display).begin_image();
                std::vector<uint8_t> buf(4096);
                uint32_t last_data = millis();
                bool complete = false;
                while (true) {
                  int n = container->read(buf.data(), buf.size());
                  // Writing a chunk to the panel can block for a while (SPI
                  // plus a controller busy-wait), so keep the watchdog fed.
                  // eink_frame::feed_watchdog() rather than App.feed_wdt():
                  // see eink_wait.h — a bare feed logs "task not found" from
                  // any task ESPHome has not subscribed to the watchdog.
                  eink_frame::feed_watchdog();
                  yield();
                  auto res = http_request::http_read_loop_result(
                      n, last_data, 30000, container->is_read_complete());
                  if (res == http_request::HttpReadLoopResult::DATA) {
                    id(epaper_display).write_image_data(buf.data(), n);
                    continue;
                  }
                  if (res == http_request::HttpReadLoopResult::RETRY)
                    continue;
                  complete = (res == http_request::HttpReadLoopResult::COMPLETE);
                  break;
                }
                size_t received = container->get_bytes_read();
                container->end();
                bool ok = complete && received >= expected;
                if (!ok) {
                  ESP_LOGE(FTAG, "Download incomplete: %u/%u bytes",
                           (unsigned) received, (unsigned) expected);
                }
                id(epaper_display).finish_image(ok);
            - lambda: id(epaper_display).sleep();
          else:
            - logger.log:
                format: "WiFi did not connect — going back to sleep"
                level: WARN
      - script.execute: maybe_sleep

  # Deep sleep guardrails. The frame must stay awake while it still needs a
  # human: unprovisioned (no WiFi credentials in NVS), never adopted by Home
  # Assistant, or deliberately pinned awake with the "Prevent Deep Sleep"
  # switch. Once it has been adopted at least once it resumes the normal
  # wake -> fetch -> sleep cycle even if HA is temporarily unreachable.
  #
  # There is deliberately no wake-button check here: `wakeup_pin_mode:
  # KEEP_AWAKE` already makes deep_sleep.enter defer while the button is still
  # held and latch the sleep for the moment it is released. A condition here
  # would instead mean "held at this instant -> never sleep again this boot".
  # Holding the button through a reset opens an OTA window by turning the
  # switch on (see on_boot), which is what the first branch below honours.
  - id: maybe_sleep
    then:
      - if:
          condition:
            switch.is_on: prevent_deep_sleep
          then:
            # Load-bearing: deep_sleep.enter ignores deep_sleep.prevent, so the
            # switch can only work by being checked here.
            - logger.log:
                format: "Prevent Deep Sleep is ON — staying awake"
                level: INFO
          else:
            - if:
                condition:
                  lambda: return !wifi::global_wifi_component->has_sta();
                then:
                  - logger.log:
                      format: "No WiFi credentials — staying awake for Improv provisioning"
                      level: INFO
                else:
                  - if:
                      condition:
                        lambda: return !id(has_been_adopted);
                      then:
                        - logger.log:
                            format: "Never adopted by Home Assistant — staying awake"
                            level: INFO
                        # Give Home Assistant a chance to discover and
                        # adopt the device on this first provisioned boot.
                        - wait_until:
                            condition:
                              lambda: return id(api_connected_this_boot);
                            timeout: 300s
                        # Re-check the switch: adoption may have taken minutes,
                        # and Home Assistant may have turned it on meanwhile.
                        - if:
                            condition:
                              and:
                                - lambda: return id(has_been_adopted);
                                - switch.is_off: prevent_deep_sleep
                            then:
                              - logger.log:
                                  format: "Adopted — entering deep sleep..."
                                  level: INFO
                              - deep_sleep.enter:
                                  id: deep_sleep_control
                                  sleep_duration: !lambda |-
                                    // NaN-safe (also catches a not-yet-restored state).
                                    float m = id(sleep_minutes).state;
                                    if (!(m >= 1.0f)) m = ${default_sleep_minutes};
                                    return (uint32_t) (m * 60000.0f);
                      else:
                        - logger.log:
                            format: "Entering deep sleep..."
                            level: INFO
                        - deep_sleep.enter:
                            id: deep_sleep_control
                            sleep_duration: !lambda |-
                              // NaN-safe (also catches a not-yet-restored state).
                              float m = id(sleep_minutes).state;
                              if (!(m >= 1.0f)) m = ${default_sleep_minutes};
                              return (uint32_t) (m * 60000.0f);

  # Wake-button hold -> flashing mode. Started by the button's on_press and
  # killed by its on_release, so only an uninterrupted 8 s hold gets to the end.
  #
  # The hold is only counted while the firmware is RUNNING. In deep sleep the
  # button is a wake source and the press that wakes the frame is consumed by
  # the wake itself, so the user flow is "press WAKE, then keep holding": the
  # GPIO binary sensor publishes its initial state during setup, which fires
  # on_press for a button that is already down when the app starts, and the 8 s
  # are timed from there.
  #
  # This does not disturb either existing use of the button, because both are
  # over in about a second:
  #   - a short press wakes the frame (deep_sleep wakeup_pin, KEEP_AWAKE);
  #   - holding it through a reset opens an OTA window by turning on "Prevent
  #     Deep Sleep" (see on_boot) and only needs to be held until that logs.
  # Nothing else can reach 8 s by accident, and the warning at 3 s says out loud
  # what is about to happen while there is still time to let go.
  #
  # Timing is best-effort: a blocking main loop (an image download, a panel
  # refresh) postpones the delays rather than cancelling them, so on a busy
  # boot the reboot can land after the refresh instead of exactly at 8 s. The
  # frame cannot fall asleep out from under the hold in the meantime: while the
  # wake pin reads active, `wakeup_pin_mode: KEEP_AWAKE` makes every
  # deep_sleep.enter defer (and holding at boot has already turned on "Prevent
  # Deep Sleep" anyway — which stays on afterwards, keeping the freshly
  # reflashed frame awake until it is switched off from Home Assistant).
  - id: flashing_mode_hold
    mode: restart
    then:
      - delay: 3s
      - logger.log:
          format: "Wake button held — keep holding for flashing mode"
          level: WARN
      - delay: 5s
      - lambda: flashing_mode::enter_flashing_mode();
